name: Build and Release Rakudo Star Package

on:
  push:
    tags:
      - 2[0-9]+.[0-1][0-1]'**' # triger with each new git tag (z.B. 2025.12)
  
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        type: string
        default: main
      version:
        description: 'Rakudo-Star version (e.g., 2025.12)'
        required: true
        type: string
      revision:
        description: 'Revision of the version (usualy 01)'
        required: true
        type: string
        default: '01'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  TERM: dump    # to make `tput` happy :|

permissions:
  contents: write # required to create a release and upload artifacts

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list   # for nfpm
          sudo apt-get update
          sudo apt-get install -y build-essential perl ncurses-bin gettext-base nfpm

      - name: Extract Version from Tag
        id: vars
        shell: bash
        run: |
          # extract git tag (i.e. v2025.12 -> 2025.12)
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION is: \"$VERSION\" and TAG_NAME is: \"$GITHUB_REF_NAME\""
          # echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # echo "TAG_NAME=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

      - name: Run rstarpkgr
        run: |
          chmod +x bin/rstarpkgr
          ./bin/rstarpkgr -V "${{ github.event.inputs.version }}"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }} || ${{ github.event.inputs.version }}
          name: Rakudo-Star ${{ github.event.inputs.version }} packages
          files: pkgs/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
